<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Information Form</title>
</head>
<body>
    <form>
        <label>Full Name:</label>
        <input type="text" id="fullname" required><br><br>

        <label>Father Name:</label>
        <input type="text" id="fathername" required><br><br>

        <label>Email:</label>
        <input type="email" id="email" required><br><br>

        <label>Password:</label>
        <input type="password" id="password" required><br><br>

        <label>Phone Number:</label>
        <input type="tel" id="phone" required><br><br>

        <label>CNIC:</label>
        <input type="text" id="cnic" placeholder="12345-1234567-1" maxlength="15"><br><br>

        <label>Date of Birth:</label>
        <input type="date" id="dob"><br><br>

        <label>Gender:</label>
        <input type="radio" name="gender" value="male" id="male">
        <label for="male">Male</label>
        <input type="radio" name="gender" value="female" id="female">
        <label for="female">Female</label><br><br>

        <label>Skills:</label>
        <input type="checkbox" name="skills" value="html" id="html">
        <label for="html">HTML</label>
        <input type="checkbox" name="skills" value="css" id="css">
        <label for="css">CSS</label>
        <input type="checkbox" name="skills" value="javascript" id="javascript">
        <label for="javascript">JavaScript</label>
        <input type="checkbox" name="skills" value="react" id="react">
        <label for="react">React</label><br><br>

        <label>Education:</label>
        <select id="education" name="education">
            <option value="matric">Matriculation</option>
            <option value="inter">Intermediate</option>
            <option value="bachelor">Bachelor's Degree</option>
            <option value="master">Master's Degree</option>
        </select><br><br>

        <label>City:</label>
        <select id="city" name="city">
            <option value="karachi">Karachi</option>
            <option value="lahore">Lahore</option>
            <option value="islamabad">Islamabad</option>
            <option value="peshawar">Peshawar</option>
            <option value="quetta">Quetta</option>
        </select><br><br>

        <label>Upload Picture:</label>
        <input type="file" id="picture" name="picture"><br><br>

        <label>Upload CV:</label>
        <input type="file" id="cv" name="cv"><br><br>

        <label>Address (required):</label>
        <textarea id="address" name="address" required></textarea><br><br>

        <input type="checkbox" id="agree" name="agree" required>
        <label for="agree">I agree to the terms and conditions</label><br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
</body>
</html>
